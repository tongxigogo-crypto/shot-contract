name: Bug report
description: The validator rejects a valid storyboard, accepts an invalid one, or misreports.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste a rule library you do not own.** Replace rule text with
        placeholders; the ids and field names are enough to reproduce a bug.

  - type: dropdown
    id: surface
    attributes:
      label: What broke?
      options:
        - Validator rejects a storyboard it should accept
        - Validator accepts a storyboard it should reject
        - Rule library validation
        - Warning is wrong or noisy
        - CLI or exit code
        - Documentation contradicts behaviour
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Exact command
      render: shell
      placeholder: node src/cli.mjs validate --file storyboard.json --rules rules.json
    validations:
      required: true

  - type: textarea
    id: payload
    attributes:
      label: Minimal storyboard
      description: Smallest JSON that reproduces the issue.
      render: json
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version and Node version
      placeholder: 0.1.0 on Node 22.22.2
    validations:
      required: true
